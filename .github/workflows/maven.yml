name: dental-app CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create .env File
        run: |
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" > .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "KEY_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> .env

      - name: Create keystore.p12 File
        run: |
          echo "${{ secrets.KEY_STORE }}" | base64 --decode > keystore.p12 > backend/src/main/resources/keystore.p12

      - name: Start Docker containers with docker-compose
        run: docker-compose up -d

      - name: Build backend with Maven
        run: mvn clean install --file backend/pom.xml -DPOSTGRES_DB=${{ secrets.POSTGRES_DB }} -DPOSTGRES_USER=${{ secrets.POSTGRES_USER }} -DPOSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} -DSECRET_KEY=${{ secrets.SECRET_KEY }} -DKEY_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}

      - name: Run tests for backend
        run: mvn test --file backend/pom.xml -DPOSTGRES_DB=${{ secrets.POSTGRES_DB }} -DPOSTGRES_USER=${{ secrets.POSTGRES_USER }} -DPOSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} -DSECRET_KEY=${{ secrets.SECRET_KEY }}

      - name: Install dependencies for frontend
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Stop Docker containers with docker-compose
        run: docker-compose down
